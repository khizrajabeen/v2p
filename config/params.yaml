# v2p run configuration.
# Generated by `v2p run --write-config`. Every key below is
# recorded in the run's provenance JSON.
# Paths are relative to the directory the command runs in.

inputs:
  folder:    # directory of variant calls; contents detected by type
  small_variants:    # explicit path, overriding detection
  rna_editing:
  fusion:
  splicing:

reference:
  dir:    # directory holding genome, annotation and proteome
  genome:    # explicit path, overriding what --ref finds
  annotation:
  proteome:
  translations:    # annotation source's own protein translations

translate:
  transcript_mode: all
  keep_unchanged: true    # keep synonymous and UTR variants
  genetic_code: auto    # auto = table 2 on the mitochondrial contig, 1 elsewhere

output:
  dir: v2p_output
  name: variant_proteome
  header_style: uniprot
  decoys: pseudo_reverse
  split_by_type: true
  append_reference: true
  logdir: logs    # keep outside output.dir or the release manifest goes stale

validate:
  min_translation_agreement: 0.9
  skip_invariant:    # release invariants to turn off, e.g. [I5]
  force: false    # proceed despite detection problems or a failed gate
